[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temporal-worker"
version = "0.1.0"
description = "Temporal worker for durable PR review workflows"
requires-python = ">=3.10"
dependencies = [
    "temporalio>=1.4.0",
    "reviewer",         # local agent package (in-tree)
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/temporal_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
