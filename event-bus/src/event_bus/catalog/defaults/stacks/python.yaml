id: python
display_name: Python
ci_image: python:3.12-slim
coder_image: dev-agents/coder-python:latest
default_sdlc: standard
detect:
  - pyproject.toml
  - requirements.txt
  - "*.py"

ci_workflow: |
  name: CI
  on:
    push:
    pull_request:

  jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Install, lint, type-check, test, audit
          run: |
            set -euo pipefail
            # The runner image lacks pip; install it (EPIC 5 prebuilt images remove this).
            apt-get update -qq && apt-get install -y -qq python3-pip >/dev/null
            python3 -m pip install --quiet --upgrade ruff pytest mypy pip-audit
            if [ -f requirements.txt ]; then python3 -m pip install --quiet -r requirements.txt; fi
            if [ -f pyproject.toml ]; then python3 -m pip install --quiet -e . || true; fi
            ruff check .
            mypy .
            python3 -m pytest -q
            # Vulnerability scan — only when the project declares third-party dependencies.
            if [ -s requirements.txt ]; then
              echo "Auditing requirements.txt for known vulnerabilities..."
              pip-audit -r requirements.txt
            elif grep -Eq '^[[:space:]]*dependencies[[:space:]]*=[[:space:]]*\[[[:space:]]*["A-Za-z]' pyproject.toml 2>/dev/null; then
              echo "Auditing declared dependencies for known vulnerabilities..."
              pip-audit
            else
              echo "No third-party dependencies declared — skipping vulnerability scan."
            fi

scaffold:
  pyproject.toml: |
    [build-system]
    requires = ["setuptools>=61"]
    build-backend = "setuptools.build_meta"

    [project]
    name = "project"
    version = "0.1.0"
    requires-python = ">=3.9"

    [tool.setuptools.packages.find]
    # Tolerate both flat (./pkg) and src (./src/pkg) layouts; never package tests.
    where = ["src", "."]
    exclude = ["tests*"]

    [tool.ruff]
    line-length = 100

    [tool.ruff.lint.per-file-ignores]
    # Tests may import a module just to assert it's importable (F401) or to set up
    # fixtures; don't let lint rules meant for app code fail the test suite.
    "tests/*" = ["F401", "F811"]
    # Package __init__.py files routinely re-export symbols for the public API.
    "__init__.py" = ["F401"]

    [tool.mypy]
    # Lenient static type-checking: resolve the src/ layout, tolerate third-party
    # packages without stubs, and don't type-check the test suite.
    ignore_missing_imports = true
    explicit_package_bases = true
    mypy_path = "src"
    exclude = "(^|/)(tests|build|dist)/"

    [tool.pytest.ini_options]
    testpaths = ["tests"]
    # Make the package importable in tests without relying on an editable install
    # (covers flat and src/ layouts regardless of what the coder created).
    pythonpath = ["src", "."]
  tests/test_smoke.py: |
    def test_smoke():
        assert True
  .gitignore: |
    __pycache__/
    *.py[cod]
    *.egg-info/
    *.egg
    build/
    dist/
    .venv/
    venv/
    .env
    .coverage
    .coverage.*
    htmlcov/
    .pytest_cache/
    .ruff_cache/
    .mypy_cache/

install_command: |
  python3 -m pip install -q -e . 2>/dev/null || true
  if [ -f requirements.txt ]; then python3 -m pip install -q -r requirements.txt || true; fi
test_command: "python3 -m pytest -q"

best_practices_prompt: |
  Write idiomatic, PEP 8-compliant Python with type hints on every function signature.
  Prefer small, focused functions and dataclasses for data; handle errors explicitly and
  never swallow exceptions silently. Your code must pass the project's checks — run all
  three locally and fix every issue before finishing:
    - ruff   (lint / style)
    - mypy   (static type-checking)
    - pytest (tests, with clear arrange/act/assert)
  If you add third-party dependencies, pin them in pyproject.toml and prefer well-
  maintained libraries with no known advisories — imported dependencies are scanned for
  known vulnerabilities with pip-audit in CI, which will fail the build if any are found.
