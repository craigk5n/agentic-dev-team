id: python
display_name: Python
ci_image: python:3.12-slim
coder_image: dev-agents/coder-python:latest
default_sdlc: standard
detect:
  - pyproject.toml
  - requirements.txt
  - "*.py"

ci_workflow: |
  name: CI
  on:
    push:
      branches: [main]
    pull_request:

  jobs:
    test:
      runs-on: ubuntu-latest
      # Run CI inside the prebuilt Python image: ruff/mypy/pytest/pip-audit/tomli + a
      # working venv + git + node (for checkout) are all baked in, so there are no
      # per-run toolchain installs and none of the bare-runner environment gaps.
      container: dev-agents/coder-python:latest
      steps:
        - uses: actions/checkout@v4
        - name: Install deps, lint, type-check, test, audit
          run: |
            set -euo pipefail
            # Install the project + its declared dependencies. Best-effort editable
            # install, then install the declared deps directly so a dropped build
            # backend can't stop the tests from importing them.
            python3 -m pip install -q -e . 2>/dev/null || true
            if [ -f requirements.txt ]; then python3 -m pip install -q -r requirements.txt || true; fi
            DEPS=""
            if grep -Eq '^[[:space:]]*dependencies[[:space:]]*=[[:space:]]*\[[[:space:]]*["A-Za-z]' pyproject.toml 2>/dev/null; then
              python3 -c "import tomli; d=tomli.load(open('pyproject.toml','rb')); print('\n'.join(d.get('project',{}).get('dependencies',[])))" > /tmp/declared-deps.txt || true
              if [ -s /tmp/declared-deps.txt ]; then python3 -m pip install -q -r /tmp/declared-deps.txt || true; DEPS=1; fi
            fi
            ruff check .
            # Type-check the source. Flags are on the CLI (not reliant on the coder
            # leaving [tool.mypy] intact); target src/ when present so a module under
            # src isn't found twice (as both "mod" and "src.mod") from the repo root.
            if [ -d src ]; then
              mypy --explicit-package-bases --ignore-missing-imports src
            elif find . -name '*.py' -not -path './tests/*' -not -path './build/*' -not -path './dist/*' | grep -q .; then
              mypy --explicit-package-bases --ignore-missing-imports --exclude '(^|/)(tests|build|dist)/' .
            else
              echo "No source files to type-check yet."
            fi
            # Fresh-environment test gate — the honest "clean install" check.
            # Run the suite in an isolated venv holding ONLY the project's DECLARED
            # dependencies (plus the test runner), sealed off from packages that happen
            # to be baked into the CI image. A module the code imports but pyproject
            # forgets to declare (e.g. an SDK) then fails HERE instead of passing on the
            # runner and breaking later on a real `pip install`. Falls back to the
            # in-image runner only if the venv can't be built (e.g. no network).
            if python3 -m venv /tmp/freshenv 2>/dev/null; then
              FRESH=/tmp/freshenv/bin
              "$FRESH/python" -m pip install -q --upgrade pip
              "$FRESH/python" -m pip install -q pytest pytest-asyncio
              if ! "$FRESH/python" -m pip install -q . ; then
                echo "::error:: clean 'pip install .' failed — fix pyproject build backend / dependencies"
                exit 1
              fi
              "$FRESH/python" -m pip install -q '.[dev]' 2>/dev/null || true
              [ -f requirements.txt ] && "$FRESH/python" -m pip install -q -r requirements.txt || true
              echo "Running tests against declared dependencies only (isolated venv)…"
              "$FRESH/python" -m pytest -q
            else
              echo "venv unavailable — falling back to the in-image runner (deps not isolated)"
              python3 -m pytest -q
            fi
            # Vulnerability scan — scoped to the project's OWN declared dependencies
            # (auditing the whole environment would flag the runner's base packages).
            if [ -s requirements.txt ]; then
              echo "Auditing requirements.txt for known vulnerabilities..."
              pip-audit -r requirements.txt
            elif [ -n "$DEPS" ] && [ -s /tmp/declared-deps.txt ]; then
              echo "Auditing declared dependencies for known vulnerabilities..."
              pip-audit -r /tmp/declared-deps.txt
            else
              echo "No third-party dependencies declared — skipping vulnerability scan."
            fi

scaffold:
  pyproject.toml: |
    [build-system]
    requires = ["setuptools>=61"]
    build-backend = "setuptools.build_meta"

    [project]
    name = "project"
    version = "0.1.0"
    requires-python = ">=3.9"

    [tool.setuptools.packages.find]
    # Tolerate both flat (./pkg) and src (./src/pkg) layouts; never package tests.
    where = ["src", "."]
    exclude = ["tests*"]

    [tool.ruff]
    line-length = 100

    [tool.ruff.lint.per-file-ignores]
    # Tests may import a module just to assert it's importable (F401) or to set up
    # fixtures; don't let lint rules meant for app code fail the test suite.
    "tests/*" = ["F401", "F811"]
    # Package __init__.py files routinely re-export symbols for the public API.
    "__init__.py" = ["F401"]

    [tool.mypy]
    # Lenient static type-checking: resolve the src/ layout, tolerate third-party
    # packages without stubs, and don't type-check the test suite.
    ignore_missing_imports = true
    explicit_package_bases = true
    mypy_path = "src"
    exclude = "(^|/)(tests|build|dist)/"

    [tool.pytest.ini_options]
    testpaths = ["tests"]
    # Make the package importable in tests without relying on an editable install
    # (covers flat and src/ layouts regardless of what the coder created).
    pythonpath = ["src", "."]
  tests/test_smoke.py: |
    def test_smoke():
        assert True
  .gitignore: |
    __pycache__/
    *.py[cod]
    *.egg-info/
    *.egg
    build/
    dist/
    .venv/
    venv/
    .env
    .coverage
    .coverage.*
    htmlcov/
    .pytest_cache/
    .ruff_cache/
    .mypy_cache/

install_command: |
  python3 -m pip install -q -e . 2>/dev/null || true
  if [ -f requirements.txt ]; then python3 -m pip install -q -r requirements.txt || true; fi
test_command: "python3 -m pytest -q"

best_practices_prompt: |
  Write idiomatic, PEP 8-compliant Python with type hints on every function signature.
  Prefer small, focused functions and dataclasses for data; handle errors explicitly and
  never swallow exceptions silently. Your code must pass the project's checks — run all
  three locally and fix every issue before finishing:
    - ruff   (lint / style)
    - mypy   (static type-checking)
    - pytest (tests, with clear arrange/act/assert)
  If you add third-party dependencies, add them to pyproject.toml's [project.dependencies]
  and keep the existing [build-system], [tool.setuptools], [tool.ruff], [tool.mypy], and
  [tool.pytest.ini_options] sections intact. Pin deps and prefer well-maintained libraries
  with no known advisories — imported dependencies are scanned for known vulnerabilities
  with pip-audit in CI, which will fail the build if any are found.

security_checklist: |
  Apply these BEFORE opening the PR — the reviewer will block on any of them:
  - Untrusted input into a shell: when generating scripts or calling a shell, escape every
    substituted value (e.g. Jinja `{{ v | replace("'", "'\\''") }}` inside single quotes,
    or pass args as a list — never interpolate into `sh -c`). Command injection is a blocker.
  - HTML output: rely on Jinja autoescaping and never mark user/tool data `| safe`; escape
    values placed into HTML attributes and `hx-*`/`_=` handler strings. XSS is a blocker.
  - Outbound URLs (discovery / proxy / fetch): validate the target. Reconcile SSRF protection
    with the project's reachability requirement — if the app is local-first, allow
    loopback/LAN via an explicit opt-in flag rather than hardcoding a public-only guard.
  - Auth: every state-changing endpoint (POST/PUT/DELETE, toggles, clears) requires the
    project's auth dependency. "Empty credentials = allow" is NOT a secure default — deny by
    default and gate any open mode behind an explicit config flag.
  - Secrets: never hardcode credentials, tokens, or default passwords in source or config.
  - Front-end assets: VENDOR JavaScript/CSS locally (e.g. under `static/vendor/`) and
    reference them with relative paths — this is a local-first tool. Do NOT load libraries
    from a public CDN, and NEVER put an `integrity=` (SRI) hash on a script tag unless you
    computed it from the exact bytes you are shipping (a wrong/guessed hash silently blocks
    the script and breaks the page).
  - Destructive edits: do not delete or wholesale-rewrite existing files (Dockerfile, config,
    templates, tests) unless the story explicitly asks for it; make the smallest change that
    satisfies the story.
