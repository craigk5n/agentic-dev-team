id: python
display_name: Python
ci_image: python:3.12-slim
coder_image: dev-agents/coder-python:latest
default_sdlc: standard
detect:
  - pyproject.toml
  - requirements.txt
  - "*.py"

ci_workflow: |
  name: CI
  on:
    push:
    pull_request:

  jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Install, lint, test
          run: |
            set -euo pipefail
            # The runner image lacks pip; install it (EPIC 5 prebuilt images remove this).
            apt-get update -qq && apt-get install -y -qq python3-pip >/dev/null
            python3 -m pip install --quiet --upgrade ruff pytest
            if [ -f requirements.txt ]; then python3 -m pip install --quiet -r requirements.txt; fi
            if [ -f pyproject.toml ]; then python3 -m pip install --quiet -e . || true; fi
            ruff check .
            python3 -m pytest -q

scaffold:
  pyproject.toml: |
    [build-system]
    requires = ["setuptools>=61"]
    build-backend = "setuptools.build_meta"

    [project]
    name = "project"
    version = "0.1.0"
    requires-python = ">=3.9"

    [tool.setuptools.packages.find]
    # Tolerate both flat (./pkg) and src (./src/pkg) layouts; never package tests.
    where = ["src", "."]
    exclude = ["tests*"]

    [tool.ruff]
    line-length = 100

    [tool.ruff.lint.per-file-ignores]
    # Tests may import a module just to assert it's importable (F401) or to set up
    # fixtures; don't let lint rules meant for app code fail the test suite.
    "tests/*" = ["F401", "F811"]
    # Package __init__.py files routinely re-export symbols for the public API.
    "__init__.py" = ["F401"]

    [tool.pytest.ini_options]
    testpaths = ["tests"]
    # Make the package importable in tests without relying on an editable install
    # (covers flat and src/ layouts regardless of what the coder created).
    pythonpath = ["src", "."]
  tests/test_smoke.py: |
    def test_smoke():
        assert True
  .gitignore: |
    __pycache__/
    *.py[cod]
    *.egg-info/
    *.egg
    build/
    dist/
    .venv/
    venv/
    .env
    .coverage
    .coverage.*
    htmlcov/
    .pytest_cache/
    .ruff_cache/
    .mypy_cache/

test_command: "python3 -m pytest -q"

best_practices_prompt: |
  Write idiomatic, PEP 8-compliant Python. Use type hints on all function signatures.
  Prefer small, focused functions and dataclasses for data. Handle errors explicitly;
  never swallow exceptions silently. Write pytest tests with clear arrange/act/assert.
