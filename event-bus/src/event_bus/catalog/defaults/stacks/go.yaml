id: go
display_name: Go
ci_image: golang:1.22
coder_image: dev-agents/coder-go:latest
default_sdlc: standard
detect:
  - go.mod
  - "*.go"

ci_workflow: |
  name: CI
  on:
    push:
      branches: [main]
    pull_request:

  jobs:
    test:
      runs-on: ubuntu-latest
      # Run CI inside the prebuilt Go image (go toolchain + git + node for checkout
      # baked in) — no per-run toolchain download.
      container: dev-agents/coder-go:latest
      steps:
        - uses: actions/checkout@v4
        - name: Vet + test
          run: |
            set -euo pipefail
            go vet ./...
            go test ./...

scaffold:
  go.mod: |
    module project

    go 1.22
  main_test.go: |
    package main

    import "testing"

    func TestSmoke(t *testing.T) {
        if 1+1 != 2 {
            t.Fatal("math is broken")
        }
    }

test_command: "go test ./..."

best_practices_prompt: |
  Write idiomatic Go: short names, early returns, explicit error handling (wrap with
  %w). Keep packages cohesive. Avoid unnecessary interfaces. Use table-driven tests
  with the standard testing package and run go vet clean.
