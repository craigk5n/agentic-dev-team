id: go
display_name: Go
ci_image: golang:1.22
coder_image: dev-agents/coder-go:latest
default_sdlc: standard
detect:
  - go.mod
  - "*.go"

ci_workflow: |
  name: CI
  on:
    push:
    pull_request:

  jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Install Go, vet, test
          run: |
            set -euo pipefail
            # Install the Go toolchain (the runner image has none; EPIC 5 prebuilt
            # images remove this). A custom container: image can't run checkout (no node).
            curl -sSL https://go.dev/dl/go1.22.5.linux-amd64.tar.gz | tar -C /usr/local -xz
            export PATH="$PATH:/usr/local/go/bin"
            go vet ./...
            go test ./...

scaffold:
  go.mod: |
    module project

    go 1.22
  main_test.go: |
    package main

    import "testing"

    func TestSmoke(t *testing.T) {
        if 1+1 != 2 {
            t.Fatal("math is broken")
        }
    }

best_practices_prompt: |
  Write idiomatic Go: short names, early returns, explicit error handling (wrap with
  %w). Keep packages cohesive. Avoid unnecessary interfaces. Use table-driven tests
  with the standard testing package and run go vet clean.
