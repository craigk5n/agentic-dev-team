[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "event-bus"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.6.0",
    "rq>=1.16.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/event_bus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=event_bus --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = [
    # Entry-point scripts invoked at runtime, not unit-testable
    "*/event_bus/worker.py",
    "*/event_bus/sandbox_runner.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"
