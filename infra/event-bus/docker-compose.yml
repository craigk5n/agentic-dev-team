# Event bus — webhook receiver + RQ worker + work item store
# Run from infra/: docker compose -f event-bus/docker-compose.yml --env-file .env up -d

version: "3.8"

x-event-bus-env: &event-bus-env
  FORGEJO_WEBHOOK_SECRET: ${FORGEJO_WEBHOOK_SECRET}
  FORGEJO_API_TOKEN: ${FORGEJO_API_TOKEN}
  FORGEJO_BASE_URL: http://forgejo:3000
  FORGEJO_GIT_URL: http://forgejo:3000
  REDIS_URL: redis://event-bus-redis:6379/0
  LOG_LEVEL: ${EVENT_BUS_LOG_LEVEL:-INFO}
  # Phase 6: Temporal address — leave blank to use RQ fallback for PR approval
  TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-}
  # Phase 7: sandbox mode — "process" (default) or "docker" (requires socket mount below)
  SANDBOX_MODE: ${SANDBOX_MODE:-process}
  SANDBOX_IMAGE: ${SANDBOX_IMAGE:-dev-agents/event-bus:latest}
  SANDBOX_MEMORY: ${SANDBOX_MEMORY:-512m}
  SANDBOX_CPUS: ${SANDBOX_CPUS:-1.0}
  # Coding Agent (Phase 3)
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
  DEFAULT_REPO: ${DEFAULT_REPO:-devadmin/sandbox}
  # Idea / Planner model — defaults to sonnet via OpenRouter
  MODEL_IDEA: ${MODEL_IDEA:-openrouter/anthropic/claude-sonnet-4-6}
  MODEL_PLANNER: ${MODEL_PLANNER:-openrouter/anthropic/claude-sonnet-4-6}
  # Coding Agent — uses opencode with OpenRouter free models (no Anthropic key needed)
  MODEL_CODER: ${MODEL_CODER:-opencode/deepseek-v4-flash-free}
  # Reviewer Agent — set OPENROUTER_API_KEY to route through OpenRouter
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  MODEL_REVIEWER: ${MODEL_REVIEWER:-openrouter/anthropic/claude-sonnet-4-6}
  MODEL_TESTER: ${MODEL_TESTER:-openrouter/anthropic/claude-haiku-4-5}
  MODEL_SECURITY: ${MODEL_SECURITY:-openrouter/anthropic/claude-haiku-4-5}
  # Forgejo webhook secret (still used for PR webhooks)
  PLANE_WEBHOOK_SECRET: ""
  PLANE_API_TOKEN: ""
  PLANE_BASE_URL: ""
  PLANE_PUBLIC_URL: ""
  PLANE_WORKSPACE_SLUG: ""
  PLANE_PROJECT_ID: ""

services:
  event-bus-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - event-bus-net
    volumes:
      - event-bus-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    deploy:
      resources:
        limits:
          memory: 128m

  event-bus:
    build:
      # Root of the repo so Dockerfile can COPY from both event-bus/ and agents/
      context: ../..
      dockerfile: event-bus/Dockerfile
    image: dev-agents/event-bus:latest
    restart: unless-stopped
    ports:
      - "${EVENT_BUS_PORT:-8090}:8080"
    environment:
      <<: *event-bus-env
    networks:
      event-bus-net:
        aliases:
          - event-bus
      forgejo_network:
        aliases:
          - event-bus
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - event-bus-data:/data
      # opencode binary + config (coding agent uses opencode, no Anthropic key needed)
      - /home/cknudsen/.opencode/bin/opencode:/usr/local/bin/opencode:ro
      - /home/cknudsen/.config/opencode:/root/.config/opencode:ro
    depends_on:
      - event-bus-redis
    deploy:
      resources:
        limits:
          memory: 1g

  event-bus-worker:
    build:
      context: ../..
      dockerfile: event-bus/Dockerfile
    image: dev-agents/event-bus:latest
    restart: unless-stopped
    command: ["python", "-m", "event_bus.worker"]
    environment:
      <<: *event-bus-env
    networks:
      event-bus-net: {}
      forgejo_network:
        aliases:
          - event-bus-worker
    volumes:
      - event-bus-data:/data
      # Bind Docker socket so SANDBOX_MODE=docker can spawn ephemeral containers.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - event-bus-redis
    deploy:
      resources:
        limits:
          memory: 768m

volumes:
  event-bus-data:
    driver: local
  event-bus-redis-data:
    driver: local

networks:
  event-bus-net:
    driver: bridge
  forgejo_network:
    external: true
    name: forgejo_default
