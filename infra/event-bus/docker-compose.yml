# Event bus — webhook receiver + RQ worker + work item store
# Run from infra/: docker compose -f event-bus/docker-compose.yml --env-file .env up -d

version: "3.8"

x-event-bus-env: &event-bus-env
  FORGEJO_WEBHOOK_SECRET: ${FORGEJO_WEBHOOK_SECRET}
  FORGEJO_API_TOKEN: ${FORGEJO_API_TOKEN}
  FORGEJO_REVIEWER_TOKEN: ${FORGEJO_REVIEWER_TOKEN:-}
  FORGEJO_CODER_TOKEN: ${FORGEJO_CODER_TOKEN:-}
  FORGEJO_BASE_URL: http://forgejo:3000
  FORGEJO_GIT_URL: http://forgejo:3000
  REDIS_URL: redis://event-bus-redis:6379/0
  # Board HTTP Basic Auth — blank password leaves the board fully open
  BOARD_AUTH_USER: ${BOARD_AUTH_USER:-admin}
  BOARD_AUTH_PASSWORD: ${BOARD_AUTH_PASSWORD:-}
  LOG_LEVEL: ${EVENT_BUS_LOG_LEVEL:-INFO}
  # Phase 6: Temporal address — leave blank to use RQ fallback for PR approval
  TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-}
  # Phase 7: sandbox mode — "process" (default) or "docker" (requires socket mount below)
  SANDBOX_MODE: ${SANDBOX_MODE:-process}
  SANDBOX_IMAGE: ${SANDBOX_IMAGE:-dev-agents/event-bus:latest}
  SANDBOX_MEMORY: ${SANDBOX_MEMORY:-512m}
  SANDBOX_CPUS: ${SANDBOX_CPUS:-1.0}
  # Host paths for bind mounts into sandbox containers (must match the actual host paths)
  SANDBOX_OPENCODE_BIN: /home/cknudsen/.opencode/bin/opencode
  SANDBOX_OPENCODE_CONFIG: /home/cknudsen/.config/opencode
  SANDBOX_NETWORK: forgejo_default
  # Coding Agent (Phase 3)
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
  DEFAULT_REPO: ${DEFAULT_REPO:-devadmin/sandbox}
  # Idea / Planner — free models; override MODEL_IDEA / MODEL_PLANNER for higher quality
  MODEL_IDEA: ${MODEL_IDEA:-openrouter/nvidia/nemotron-3-super-120b-a12b:free}
  MODEL_PLANNER: ${MODEL_PLANNER:-openrouter/nvidia/nemotron-3-super-120b-a12b:free}
  # Claude Code subscription planning (optional): token from `claude setup-token`.
  # Enables the "claude-code/*" subscription models for the IDEA + PLANNER roles
  # only; the high-volume coder/reviewer fleet must stay on API/free models.
  CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
  # Coding Agent — uses opencode with OpenRouter free model (no Anthropic key needed)
  MODEL_CODER: ${MODEL_CODER:-openrouter/nvidia/nemotron-3-super-120b-a12b:free}
  # Reviewer Agent — Sonnet for quality; set OPENROUTER_API_KEY to route through OpenRouter
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  MODEL_REVIEWER: ${MODEL_REVIEWER:-openrouter/nvidia/nemotron-3-super-120b-a12b:free}
  MODEL_TESTER: ${MODEL_TESTER:-openrouter/meta-llama/llama-3.3-70b-instruct:free}
  MODEL_SECURITY: ${MODEL_SECURITY:-openrouter/meta-llama/llama-3.3-70b-instruct:free}

services:
  event-bus-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - event-bus-net
    volumes:
      - event-bus-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    deploy:
      resources:
        limits:
          memory: 128m

  event-bus:
    build:
      # Root of the repo so Dockerfile can COPY from both event-bus/ and agents/
      context: ../..
      dockerfile: event-bus/Dockerfile
    image: dev-agents/event-bus:latest
    restart: unless-stopped
    ports:
      - "${EVENT_BUS_PORT:-8090}:8080"
    environment:
      <<: *event-bus-env
    networks:
      event-bus-net:
        aliases:
          - event-bus
      forgejo_network:
        aliases:
          - event-bus
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - event-bus-data:/data
      # opencode binary + config (coding agent uses opencode, no Anthropic key needed)
      - /home/cknudsen/.opencode/bin/opencode:/usr/local/bin/opencode:ro
      - /home/cknudsen/.config/opencode:/root/.config/opencode:ro
      # claude CLI (host install) — subscription-backed planning via `claude -p`
      - /home/cknudsen/.local/bin/claude:/usr/local/bin/claude:ro
      # Docker socket — needed when SANDBOX_MODE=docker to spawn ephemeral containers
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - event-bus-redis
    deploy:
      resources:
        limits:
          memory: 1g

  event-bus-worker:
    build:
      context: ../..
      dockerfile: event-bus/Dockerfile
    image: dev-agents/event-bus:latest
    restart: unless-stopped
    command: ["python", "-m", "event_bus.worker"]
    environment:
      <<: *event-bus-env
    networks:
      event-bus-net: {}
      forgejo_network:
        aliases:
          - event-bus-worker
    volumes:
      - event-bus-data:/data
      # Bind Docker socket so SANDBOX_MODE=docker can spawn ephemeral containers.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - event-bus-redis
    deploy:
      # Multiple worker replicas so verdict jobs (reviewer/tester/security) actually run
      # in parallel up to the per-role concurrency limits — a single RQ worker processes
      # one sandboxed job at a time and can't keep up with a fleet's PR review volume.
      replicas: 3
      resources:
        limits:
          memory: 768m

volumes:
  event-bus-data:
    driver: local
  event-bus-redis-data:
    driver: local

networks:
  event-bus-net:
    driver: bridge
  forgejo_network:
    external: true
    name: forgejo_default
