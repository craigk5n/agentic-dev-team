# Plane Community Edition — self-hosted
# Based on: https://github.com/makeplane/plane/tree/stable/deploy/selfhost
# Run from the infra/ directory: docker compose -f plane/docker-compose.yml --env-file .env up -d

version: "3.8"

x-plane-env: &plane-env
  SECRET_KEY: ${PLANE_SECRET_KEY}
  DATABASE_URL: postgresql://plane:${PLANE_DB_PASSWORD}@plane-db/plane
  REDIS_URL: redis://plane-redis:6379/
  CELERY_BROKER_URL: redis://plane-redis:6379/
  AWS_REGION: ${MINIO_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: ${MINIO_BUCKET:-uploads}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  WEB_URL: ${PLANE_URL:-http://localhost:8181}
  CORS_ALLOWED_ORIGINS: ${PLANE_URL:-http://localhost:8181}
  DJANGO_SETTINGS_MODULE: plane.settings.production
  GUNICORN_WORKERS: ${PLANE_GUNICORN_WORKERS:-2}
  # Allow event-bus Docker service name and the internal Docker network
  WEBHOOK_ALLOWED_HOSTS: "event-bus"
  WEBHOOK_ALLOWED_IPS: "172.24.0.0/16"

services:
  plane-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: plane
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: ${PLANE_DB_PASSWORD}
    volumes:
      - plane-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  plane-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - plane-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64m

  plane-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - plane-minio-data:/data
    ports:
      - "9001:9001"   # MinIO console (internal only in production — remove this line)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  # Network aliases (api, web, space) match what the Caddy proxy Caddyfile expects
  plane-api:
    image: makeplane/plane-backend:stable
    restart: unless-stopped
    # Custom entrypoint: same as upstream but tolerates kombu broadcast errors
    # (register_instance / configure_instance hit a ChannelPromise bug in kombu 5.4+)
    command: /entrypoint-api.sh
    volumes:
      - ./entrypoint-api.sh:/entrypoint-api.sh:ro
    environment:
      <<: *plane-env
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-minio:
        condition: service_healthy
    networks:
      default:
        aliases:
          - api
    deploy:
      resources:
        limits:
          memory: 512m

  plane-worker:
    image: makeplane/plane-backend:stable
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    environment:
      <<: *plane-env
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  plane-beat:
    image: makeplane/plane-backend:stable
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    environment:
      <<: *plane-env
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m

  plane-web:
    image: makeplane/plane-frontend:stable
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PLANE_URL:-http://localhost:8181}
      NEXT_PUBLIC_DEPLOY_URL: ${PLANE_URL:-http://localhost:8181}/s
    networks:
      default:
        aliases:
          - web
    deploy:
      resources:
        limits:
          memory: 256m

  plane-space:
    image: makeplane/plane-space:stable
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PLANE_URL:-http://localhost:8181}
      NEXT_PUBLIC_DEPLOY_URL: ${PLANE_URL:-http://localhost:8181}/s
    networks:
      default:
        aliases:
          - space
    deploy:
      resources:
        limits:
          memory: 256m

  plane-proxy:
    image: makeplane/plane-proxy:stable
    restart: unless-stopped
    ports:
      - "${PLANE_HTTP_PORT:-8181}:${PLANE_HTTP_PORT:-8181}"
    environment:
      # SITE_ADDRESS tells Caddy what address to bind; must match the exposed port
      SITE_ADDRESS: ":${PLANE_HTTP_PORT:-8181}"
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${MINIO_BUCKET:-uploads}
      # Leave cert vars empty for HTTP-only local setup
      CERT_EMAIL: ""
      CERT_ACME_DNS: ""
    depends_on:
      - plane-api
      - plane-web
      - plane-space
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PLANE_HTTP_PORT:-8181}/api/instances/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  plane-db-data:
  plane-redis-data:
  plane-minio-data:
