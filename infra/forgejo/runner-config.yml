# Forgejo Actions runner configuration
# https://code.forgejo.org/forgejo/runner

log:
  level: info

runner:
  file: /data/.runner
  capacity: 2          # concurrent jobs; raise if the host has spare CPU
  env_vars: {}
  timeout: 3h
  insecure: false
  fetch_timeout: 5s
  fetch_interval: 2s
  labels:
    - "ubuntu-latest:docker://node:20-bullseye"
    - "ubuntu-22.04:docker://node:20-bullseye"

cache:
  enabled: true
  dir: /data/cache
  host: ""
  port: 0

container:
  # Attach job containers to Forgejo's network so `actions/checkout` can resolve
  # the internal `forgejo:3000` clone host. Without this, the runner puts each job
  # on an isolated per-workflow network and checkout fails ("Could not resolve host").
  network: "forgejo_default"
  privileged: false
  options:
  valid_volumes: []
  docker_host: ""
  # Pull images every time to avoid stale layers in CI
  force_pull: false

host:
  workdir_parent: /data/work
